name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vocabulary:
    name: Validate vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false
      - name: Validate catalog and failure controls
        run: uv run --locked --script scripts/check_catalog.py --selftest
      - name: Validate candidate stable namespace and identity controls
        run: uv run --locked --script scripts/publish_stable_namespace.py --selftest
      - name: Verify release publication boundaries
        run: uv run --locked --script scripts/test_release_workflow.py
      - name: Validate shapes, examples and failure controls
        run: uv run --locked --script scripts/check_shapes.py --selftest
      - name: Validate the trim (decisions, pinned targets, alignments) and its failure controls
        run: uv run --locked --script scripts/trim.py --selftest
      - name: Validate explicit governance profile and boundary examples
        run: uv run --locked --script scripts/check_governance_profile.py
      - name: Validate valid-time projection contracts
        run: python3 -m unittest discover -s tests -v
      - name: Validate scheduled-job profile and refusal controls
        run: uv run --locked --script scripts/check_scheduled_jobs.py
      - name: Validate opt-in data catalog and exact admission controls
        run: uv run --locked --script scripts/check_data_catalog.py

  repository-pendant-source:
    name: Repository pendant source controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned RDF test parser
        run: python3 -m pip install rdflib==7.6.0
      - name: Test copied pointer and publication boundaries
        run: |
          python3 scripts/test-repository-share-query.py
          python3 scripts/test-repository-knowledge.py
          python3 scripts/test-repository-share-publication.py
