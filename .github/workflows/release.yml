name: Release

# Called after a merged release PR, with tag pushes retained as recovery.
# Pages serves ns.ttl from main; releases publish an immutable, digest-listed copy:
# consumers (caboodle first) pin quechua-ns-vX.Y.Z.ttl by the SHA-256 they
# reviewed, never the Pages URL.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

# This job holds contents:write and mints the asset consumers pin by digest,
# so every action it runs is pinned by COMMIT SHA, never a movable tag.

concurrency:
  group: quechua-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_FROM_PR: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      # The same validator as CI, plus: the tag must equal the catalog's own
      # owl:versionInfo, and its CHANGELOG section becomes the release notes.
      # Either check failing publishes nothing.
      - name: Validate, match the tag, extract notes
        run: |
          uv run --locked --script scripts/check_catalog.py --selftest \
            --expect-version "$RELEASE_TAG" --notes "$RUNNER_TEMP/notes.md"
          uv run --locked --script scripts/check_shapes.py --selftest
          uv run --locked --script scripts/trim.py --selftest

      - name: Assets and checksums
        run: |
          set -euo pipefail
          mkdir dist
          cp ns.ttl "dist/quechua-ns-$RELEASE_TAG.ttl"
          cp alignments.ttl "dist/quechua-alignments-$RELEASE_TAG.ttl"
          for f in shapes/*.shapes.ttl; do
            name=$(basename "$f" .shapes.ttl)
            cp "$f" "dist/quechua-$name-shapes-$RELEASE_TAG.ttl"
          done
          cd dist
          sha256sum quechua-*-"$RELEASE_TAG.ttl" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_FROM_PR" ]; then
            # release-please creates the draft and tag with GITHUB_TOKEN. That tag
            # cannot trigger this workflow again: publish in its caller's run.
            draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            test "$draft" = true
            gh release upload "$RELEASE_TAG" dist/quechua-*.ttl dist/SHA256SUMS.txt
            gh release edit "$RELEASE_TAG" --draft=false \
              --title "Quechua vocabulary $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Quechua vocabulary $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              dist/quechua-*.ttl dist/SHA256SUMS.txt
          fi
